spring.application.name=involens_be
spring.profiles.default=dev

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/involens}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST}
app.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
app.rabbitmq.extract.exchange=${RABBITMQ_EXTRACT_EXCHANGE}
app.rabbitmq.extract.queue=${RABBITMQ_EXTRACT_QUEUE}
app.rabbitmq.extract.routing-key=${RABBITMQ_EXTRACT_ROUTING_KEY}
app.rabbitmq.result.exchange=${RABBITMQ_RESULT_EXCHANGE}
app.rabbitmq.result.routing-key=${RABBITMQ_RESULT_ROUTING_KEY}
app.rabbitmq.result.queue=${RABBITMQ_RESULT_QUEUE}
app.rabbitmq.result.dead-letter-queue=${RABBITMQ_RESULT_DEAD_LETTER_QUEUE}

app.minio.endpoint=${MINIO_ENDPOINT}
app.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT}
app.minio.region=${MINIO_REGION:us-east-1}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${MINIO_BUCKET}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=50MB
app.upload.max-file-size=5MB
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.jwt.refresh-expiration-seconds=604800
app.jwt.issuer=involens-be

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
