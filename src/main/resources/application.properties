spring.application.name=involens_be
spring.profiles.default=dev

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/involens}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:involens}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:involens_local_2026}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:involens}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:involens_rabbit_local_2026}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:involens}
app.rabbitmq.enabled=${RABBITMQ_ENABLED:true}
app.rabbitmq.extract.exchange=${RABBITMQ_EXTRACT_EXCHANGE:involens}
app.rabbitmq.extract.queue=${RABBITMQ_EXTRACT_QUEUE:involens.request}
app.rabbitmq.extract.routing-key=${RABBITMQ_EXTRACT_ROUTING_KEY:request}
app.rabbitmq.result.queue=${RABBITMQ_RESULT_QUEUE:involens.result}
app.rabbitmq.result.dead-letter-queue=${RABBITMQ_RESULT_DEAD_LETTER_QUEUE:involens.dlt}

app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://3.25.226.163:9000}
app.minio.region=${MINIO_REGION:us-east-1}
app.minio.access-key=${MINIO_ACCESS_KEY:involens_admin}
app.minio.secret-key=${MINIO_SECRET_KEY:involens_minio_local_2026}
app.minio.bucket=${MINIO_BUCKET:involens-documents}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.jwt.refresh-expiration-seconds=604800
app.jwt.issuer=involens-be

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
